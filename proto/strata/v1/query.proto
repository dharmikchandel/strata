syntax = "proto3";

package strata.v1;

option go_package = "github.com/dharmikchandel/strata/gen/strata/v1;stratav1";

// QueryService searches stored logs.
service QueryService {
  // Search returns the earliest matching lines in timestamp order (or the
  // latest, newest first, with newest_first), plus metrics describing how much
  // work the search did.
  rpc Search(SearchRequest) returns (SearchResponse);

  // Stats describes what is stored: how many lines, in how many segments, over
  // what time range, and which tag values exist. It reads only the manifest,
  // never object storage.
  rpc Stats(StatsRequest) returns (StatsResponse);

  // System shows the machinery at work: every segment with its size and how
  // many merges its lines have been through, what the server has done lately
  // (sealed, merged, cleaned up), how fast lines arrive and how full the
  // ingest buffer is. Like Stats it never reads object storage.
  rpc System(SystemRequest) returns (SystemResponse);
}

message SearchRequest {
  // Full-text search on the message. A line matches only if it contains ALL
  // terms (letters and digits, case-insensitive), in any order. Empty means
  // "every line", which still needs a time range or tags to be useful.
  string text = 1;
  // Optional exact-match tag filters; a line must have every one.
  map<string, string> tags = 2;
  // Time range [from, to) in nanoseconds since the Unix epoch. Zero means
  // unbounded on that side.
  int64 from_unix_nano = 3;
  int64 to_unix_nano = 4;
  // Maximum number of hits. Zero means the server default; values above the
  // server's maximum are rejected.
  uint32 limit = 5;
  // Return the latest matching lines, newest first, instead of the earliest
  // in timestamp order. The histogram and metrics are the same either way.
  bool newest_first = 6;
}

message SearchHit {
  int64 timestamp_unix_nano = 1;
  string message = 2;
  map<string, string> tags = 3;
  // The segment the line was read from.
  string segment_id = 4;
}

// How much work a search did. The point of Strata is to read as little as
// possible, and these numbers show how well that worked for this query.
message SearchMetrics {
  // Every active segment: what a naive scan would have read.
  uint32 segments_considered = 1;
  // Ruled out because their time range misses the query's.
  uint32 skipped_by_time = 2;
  // Ruled out because a query term is definitely not in them (bloom filter).
  uint32 skipped_by_bloom = 3;
  // Actually fetched from object storage and searched.
  uint32 segments_scanned = 4;
  // Total size of the segments fetched.
  uint64 bytes_read = 5;
  // Times the search restarted because a segment was replaced mid-query.
  uint32 retries = 6;
  // Time spent inside the server, in microseconds.
  uint64 server_micros = 7;
}

message SearchResponse {
  repeated SearchHit hits = 1;
  // True if more lines matched than the limit allowed.
  bool truncated = 2;
  SearchMetrics metrics = 3;
  // What happened to every segment, oldest first, so a client can draw the
  // search as it happened. Empty when there are more segments than the server
  // is willing to list (see segments_truncated); the counts in metrics are
  // always complete.
  repeated SegmentOutcome segments = 4;
  bool segments_truncated = 5;
  // Matching lines over time, counted in every segment that was read. A
  // skipped segment holds no match by construction (its time range misses the
  // query's, or a query word is definitely not in it), so these counts cover
  // every matching line, not only the ones returned in hits. Absent when no
  // segment overlaps the time range.
  Histogram histogram = 6;
}

// Counts per time bucket. Buckets are of equal width, aligned to multiples of
// that width since the Unix epoch, and together cover the part of the query's
// time range that holds data.
message Histogram {
  // Start of the first bucket, in nanoseconds since the Unix epoch.
  int64 start_unix_nano = 1;
  int64 bucket_nanos = 2;
  repeated uint64 counts = 3;
}

// What one search did with one segment.
message SegmentOutcome {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // Ruled out because its time range misses the query's.
    KIND_SKIPPED_BY_TIME = 1;
    // Ruled out because a query word is definitely not in it.
    KIND_SKIPPED_BY_BLOOM = 2;
    // Fetched from object storage and searched.
    KIND_SCANNED = 3;
  }
  Kind kind = 1;
  string segment_id = 2;
  // The segment's first and last log time, in nanoseconds since the Unix epoch.
  int64 min_unix_nano = 3;
  int64 max_unix_nano = 4;
  // Size of the segment file.
  uint64 size_bytes = 5;
  // Bytes fetched: the whole file for a scanned segment, zero otherwise.
  uint64 bytes_read = 6;
  // How many of the returned lines came from this segment.
  uint32 hits = 7;
}

message StatsRequest {}

message StatsResponse {
  // Active segments (the ones searches can see).
  uint32 segments = 1;
  // Total log lines across them.
  uint64 entries = 2;
  // Total size of the segment files, in bytes.
  uint64 stored_bytes = 3;
  // Earliest and latest log timestamps, in nanoseconds since the Unix epoch.
  // Both are zero when nothing is stored yet.
  int64 min_unix_nano = 4;
  int64 max_unix_nano = 5;
  // The tag values stored, by key, so a client can suggest them. Bounded:
  // see TagKey.capped.
  repeated TagKey tags = 6;
}

message TagKey {
  string key = 1;
  repeated string values = 2;
  // More values exist for this key than the server keeps a list of.
  bool capped = 3;
}

message SystemRequest {
  // Only events with a higher sequence number are returned: pass the last
  // one seen to get each event once.
  uint64 events_after = 1;
}

message SystemResponse {
  // Active segments, oldest first. At most the newest 2,000; segments_total
  // counts them all.
  repeated SegmentInfo segments = 1;
  uint32 segments_total = 2;
  // What the server has done since it started (it keeps the latest few
  // hundred events in memory only), oldest first.
  repeated SystemEvent events = 3;
  // When the server started: no event before it is known.
  int64 started_unix_nano = 4;
  // Lines accepted per second, averaged over the last 10 seconds.
  double ingest_lines_per_second = 5;
  // The ingest buffer: bytes waiting to be sealed, the size at which a
  // segment is sealed, and the size at which new lines are refused.
  uint64 buffer_bytes = 6;
  uint64 buffer_seal_bytes = 7;
  uint64 buffer_limit_bytes = 8;
  bool compaction = 9;
  // A segment is also sealed when its oldest line has waited this long.
  int64 buffer_seal_after_millis = 10;
}

message SegmentInfo {
  string segment_id = 1;
  uint64 size_bytes = 2;
  uint64 lines = 3;
  int64 min_unix_nano = 4;
  int64 max_unix_nano = 5;
  // 0 for a segment written by ingest; one more than its newest input for a
  // segment written by compaction.
  uint32 generation = 6;
  int64 created_unix_nano = 7;
}

message SystemEvent {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // The ingest buffer wrote a new segment.
    KIND_SEALED = 1;
    // Compaction replaced several segments with one.
    KIND_MERGED = 2;
    // Garbage collection removed files nothing needed any more.
    KIND_CLEANED = 3;
  }
  uint64 seq = 1;
  int64 at_unix_nano = 2;
  Kind kind = 3;
  // Sealed: the new segment. Merged: the merged one.
  string segment_id = 4;
  // Merged: the segments it replaced.
  repeated string inputs = 5;
  uint64 lines = 6;
  uint64 bytes = 7;
  // Merged: the inputs' total size.
  uint64 bytes_in = 8;
  // Cleaned: files removed.
  uint32 files = 9;
}
